<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#E8F0FE"/>
  <!-- Grass / open areas -->
  <rect x="0" y="0" width="800" height="600" fill="#D1FAE5" opacity="0.3"/>
  <!-- Edificio C -->
  <rect x="100" y="200" width="200" height="150" rx="4" fill="#3B82F6" opacity="0.15" stroke="#3B82F6" stroke-width="2"/>
  <text x="200" y="260" textAnchor="middle" dominantBaseline="central" fill="#1E40AF" font-weight="700" font-size="14" font-family="system-ui">Edificio C</text>
  <text x="200" y="280" textAnchor="middle" dominantBaseline="central" fill="#1E40AF" font-weight="500" font-size="10" font-family="system-ui">C-12 · C-20 · C-31</text>
  <!-- Edificio Básicos -->
  <rect x="500" y="200" width="200" height="150" rx="4" fill="#3B82F6" opacity="0.15" stroke="#3B82F6" stroke-width="2"/>
  <text x="600" y="260" textAnchor="middle" dominantBaseline="central" fill="#1E40AF" font-weight="700" font-size="14" font-family="system-ui">Edificio Básicos</text>
  <text x="600" y="280" textAnchor="middle" dominantBaseline="central" fill="#1E40AF" font-weight="500" font-size="10" font-family="system-ui">G-21 · H-32 · G-35</text>
  <!-- Edificio B / Adm -->
  <rect x="300" y="400" width="200" height="120" rx="4" fill="#FB923C" opacity="0.15" stroke="#FB923C" stroke-width="2"/>
  <text x="400" y="445" textAnchor="middle" dominantBaseline="central" fill="#9A3412" font-weight="700" font-size="13" font-family="system-ui">Capilla / Adm.</text>
  <text x="400" y="465" textAnchor="middle" dominantBaseline="central" fill="#9A3412" font-weight="500" font-size="10" font-family="system-ui">Auditorio · Cafetería</text>
  <!-- Taller Electricidad -->
  <rect x="600" y="400" width="180" height="100" rx="4" fill="#FB923C" opacity="0.15" stroke="#FB923C" stroke-width="2"/>
  <text x="690" y="440" textAnchor="middle" dominantBaseline="central" fill="#9A3412" font-weight="700" font-size="11" font-family="system-ui">Taller Elec.</text>
  <text x="690" y="458" textAnchor="middle" dominantBaseline="central" fill="#9A3412" font-weight="500" font-size="10" font-family="system-ui">F21 · B21</text>
  <!-- Paths between buildings -->
  <line x1="300" y1="275" x2="500" y2="275" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,3" opacity="0.4"/>
  <line x1="400" y1="350" x2="400" y2="400" stroke="#FB923C" stroke-width="2" stroke-dasharray="6,3" opacity="0.4"/>
  <line x1="700" y1="350" x2="690" y2="400" stroke="#FB923C" stroke-width="2" stroke-dasharray="6,3" opacity="0.4"/>
  <!-- Waypoint dots -->
  <circle cx="300" cy="275" r="5" fill="#3B82F6" opacity="0.6"/>
  <circle cx="500" cy="275" r="5" fill="#3B82F6" opacity="0.6"/>
  <circle cx="400" cy="350" r="5" fill="#FB923C" opacity="0.6"/>
  <circle cx="700" cy="350" r="5" fill="#FB923C" opacity="0.6"/>
  <!-- Labels -->
  <text x="400" y="270" textAnchor="middle" dominantBaseline="central" fill="#6B7280" font-weight="600" font-size="9" font-family="system-ui">Camino principal</text>
  <text x="400" y="30" textAnchor="middle" dominantBaseline="central" fill="#1E40AF" font-weight="800" font-size="16" font-family="system-ui">CAMPUS KINAL — VISTA GENERAL</text>
  <!-- Compass -->
  <text x="750" y="40" textAnchor="middle" dominantBaseline="central" fill="#6B7280" font-weight="700" font-size="12" font-family="system-ui">N ?</text>
</svg>