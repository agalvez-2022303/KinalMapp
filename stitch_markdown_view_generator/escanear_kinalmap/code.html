<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #fee269, transparent);
            box-shadow: 0 0 15px #fee269;
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 0%; }
            50% { top: 100%; }
        }
        .gold-shimmer {
            background: linear-gradient(45deg, #6f5d00 25%, #fee269 50%, #6f5d00 75%);
            background-size: 200% 200%;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .camera-mask {
            background: rgba(13, 20, 32, 0.7);
            backdrop-filter: blur(4px);
        }
    </style>

<script>
        // Micro-interactions for the Scanner View
        const flashBtn = document.getElementById('flashBtn');
        let flashOn = false;

        flashBtn.addEventListener('click', () => {
            flashOn = !flashOn;
            const icon = flashBtn.querySelector('.material-symbols-outlined');
            if (flashOn) {
                icon.textContent = 'flashlight_off';
                icon.style.fontVariationSettings = "'FILL' 1";
                flashBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                flashBtn.classList.remove('bg-white/10', 'text-white');
            } else {
                icon.textContent = 'flashlight_on';
                icon.style.fontVariationSettings = "'FILL' 0";
                flashBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                flashBtn.classList.add('bg-white/10', 'text-white');
            }
        });

        // Simulate scanning detection for feedback
        setInterval(() => {
            const statusText = document.querySelector('.font-label-bold');
            const dot = statusText.previousElementSibling;
            
            // Randomly simulate "Searching..." state
            if (Math.random() > 0.8) {
                statusText.textContent = "STATUS: SEARCHING...";
                dot.classList.replace('bg-secondary-container', 'bg-white');
            } else {
                statusText.textContent = "STATUS: IDLE";
                dot.classList.replace('bg-white', 'bg-secondary-container');
            }
        }, 3000);
    </script>
